syntax = "proto3";

package progress;

service ProgressService {
  rpc MarkLessonWatched (WatchRequest) returns (ProgressResponse);
  rpc GetCourseProgress (ProgressRequest) returns (ProgressResponse);
  rpc GetStudentStats (StudentStatsRequest) returns (StudentStatsResponse);
}

message WatchRequest {
  string student_id = 1;
  string course_id = 2;
  string lesson_id = 3;
  int32 watch_seconds = 4;
}

message ProgressRequest {
  string student_id = 1;
  string course_id = 2;
}

message ProgressResponse {
  string student_id = 1;
  string course_id = 2;
  int32 lessons_watched = 3;
  int32 total_lessons = 4;
  double completion_percent = 5;
  repeated string watched_lesson_ids = 6;
}

message StudentStatsRequest {
  string student_id = 1;
}

message StudentStatsResponse {
  string student_id = 1;
  int32 streak_days = 2;
  string last_activity = 3;
  int32 total_watch_seconds = 4;
  int32 courses_in_progress = 5;
}
