services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

  course-service:
    build: .
    command: node assignment1/course-service/index.js
    environment:
      SERVICE_NAME: course-service
      PORT: 3001
      KAFKA_BROKERS: kafka:29092
    depends_on:
      - kafka

  progress-service:
    build: .
    command: node assignment1/progress-service/index.js
    environment:
      SERVICE_NAME: progress-service
      GRPC_PORT: 50051
      HEALTH_PORT: 50052
      KAFKA_BROKERS: kafka:29092
      KAFKA_TX_ID: progress-tx-1
    depends_on:
      - kafka

  recommendation-1:
    build: .
    command: node assignment1/recommendation-service/index.js
    ports:
      - "3003:3003"
    environment:
      SERVICE_NAME: recommendation-service
      PORT: 3003
      INSTANCE_ID: rec-1
      CONSUMER_GROUP_SUFFIX: g1
      KAFKA_BROKERS: kafka:29092
      IN_DOCKER: "true"
    depends_on:
      kafka:
        condition: service_healthy

  recommendation-2:
    build: .
    command: node assignment1/recommendation-service/index.js
    ports:
      - "3004:3004"
    environment:
      SERVICE_NAME: recommendation-service
      PORT: 3004
      INSTANCE_ID: rec-2
      CONSUMER_GROUP_SUFFIX: g1
      KAFKA_BROKERS: kafka:29092
      IN_DOCKER: "true"
    depends_on:
      kafka:
        condition: service_healthy

  learning-gateway:
    build: .
    command: node assignment1/api-gateway/index.js
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8080
      JWT_SECRET: learning-demo-secret
      COURSE_SERVICE_URL: http://course-service:3001
      PROGRESS_GRPC_HOST: progress-service
      PROGRESS_GRPC_PORT: 50051
      RECOMMENDATION_INSTANCES: recommendation-1:3003,recommendation-2:3004
      KAFKA_BROKERS: kafka:29092
      IN_DOCKER: "true"
    depends_on:
      course-service:
        condition: service_started
      progress-service:
        condition: service_started
      recommendation-1:
        condition: service_started
      recommendation-2:
        condition: service_started

  device-registry:
    build: .
    command: node assignment2/device-registry/index.js
    ports:
      - "3011:3011"
    environment:
      PORT: 3011
      IN_DOCKER: "true"

  telemetry-service:
    build: .
    command: node assignment2/telemetry-service/index.js
    ports:
      - "3010:3010"
    environment:
      PORT: 3010
      REGISTRY_URL: http://device-registry:3011
      KAFKA_BROKERS: kafka:29092
      KAFKA_TX_ID: telemetry-tx-1
      IN_DOCKER: "true"
    depends_on:
      kafka:
        condition: service_healthy
      device-registry:
        condition: service_started

  alert-engine-1:
    build: .
    command: node assignment2/alert-engine/index.js
    ports:
      - "3020:3020"
    environment:
      PORT: 3020
      INSTANCE_ID: alert-1
      CONSUMER_GROUP_SUFFIX: alerts
      KAFKA_BROKERS: kafka:29092
      IN_DOCKER: "true"
    depends_on:
      kafka:
        condition: service_healthy

  alert-engine-2:
    build: .
    command: node assignment2/alert-engine/index.js
    ports:
      - "3021:3021"
    environment:
      PORT: 3021
      INSTANCE_ID: alert-2
      CONSUMER_GROUP_SUFFIX: alerts
      KAFKA_BROKERS: kafka:29092
      IN_DOCKER: "true"
    depends_on:
      kafka:
        condition: service_healthy

  collector:
    build: .
    command: node assignment2/collector-service/index.js --source synthetic
    profiles:
      - collector
    environment:
      COLLECTOR_SOURCE: synthetic
      POLL_INTERVAL_MS: 30000
      KAFKA_BROKERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  collector-thingspeak:
    build: .
    command: node assignment2/collector-service/index.js --source thingspeak
    profiles:
      - thingspeak
    environment:
      THINGSPEAK_CHANNEL: "2427201"
      POLL_INTERVAL_MS: 10000
      KAFKA_BROKERS: kafka:29092
      TELEMETRY_URL: http://telemetry-service:3010
    depends_on:
      - kafka
      - telemetry-service

  iot-gateway:
    build: .
    command: node assignment2/ingress-gateway/index.js
    ports:
      - "8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PORT: 8090
      SENSOR_API_KEYS: sensor-key-demo-1,sensor-key-demo-2
      TELEMETRY_URLS: http://telemetry-service:3010,http://host.docker.internal:3010
      REGISTRY_URLS: http://device-registry:3011,http://host.docker.internal:3011
      ALERT_ENGINE_INSTANCES: alert-engine-1:3020,alert-engine-2:3021
      IN_DOCKER: "true"
    depends_on:
      telemetry-service:
        condition: service_started
      device-registry:
        condition: service_started
      alert-engine-1:
        condition: service_started
      alert-engine-2:
        condition: service_started
